version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

    # Native packages. The reason is not "Expo pins them" — it is that **CI
    # cannot verify them at all**. `npm run lint` and `npm run test` never build
    # the native app: jest renders into a fake React Native and vitest runs an
    # in-memory database. A version that breaks the build passes both and fails
    # at `eas build`, eight minutes and a queue later.
    #
    # That is not hypothetical. Dependabot proposed react-native-gesture-handler
    # 2.32.0 → 3.2.1 while expo/bundledNativeModules.json pins ~2.32.0, and CI
    # was green.
    #
    # 28 of these are pinned by the SDK and move with `npx expo install --fix`
    # during an SDK upgrade. Two are not, and are listed here for the same
    # CI-cannot-see-it reason rather than a pinning one:
    #   expo                      — the SDK itself; bumping it *is* the upgrade
    #   expo-speech-recognition   — third-party (jamsch), and a native module.
    #     Day 2 pinned 56.0.3 because no SDK 57 release existed; 57.0.0 now
    #     does, and taking it needs an EAS build and a device check, which is
    #     its own slice — see INFRA.md #4.
    #
    # Ignore entries are additive: a narrower rule cannot re-open what a
    # wildcard above it has closed. To let one of these through, remove it from
    # this list rather than adding an exception below.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "jest-expo"

      # Majors held back because the ecosystem around them has not caught up.
      # Patches and minors still come through.
      #   typescript 7 — "Cannot read properties of undefined (reading 'Intrinsic')"
      #   eslint 10    — eslint-plugin-react calls getFilename, removed in 10
      #   vitest 5     — passes, but vitest *is* the backend verification; not
      #                  worth swapping the instrument before launch
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
