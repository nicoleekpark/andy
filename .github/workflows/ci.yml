name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint & typecheck
        run: npm run lint
      # Jest's compile cache, kept between runs. Every run used to compile the
      # whole route tree from scratch, which is what pushed a cold first test
      # past jest's old 5 s limit (runs 180/181, REFACTOR.md → H). Entries are
      # keyed by file content, so a stale one is never used; the key only
      # decides which cache to start from.
      - name: Restore jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'babel.config.js') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'babel.config.js') }}-
      - name: Test (RN + Convex)
        run: npm run test

# This mirrors small-commit-flow's local loop (lint + test) so a slice that
# skipped a step locally, or a push that bypassed small-commit-flow entirely,
# still gets caught before merge — this is the platform-enforced backstop for
# CLAUDE.md's Branching Policy, not a replacement for the local loop.
